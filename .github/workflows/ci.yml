name: CI

on:
  push:
  pull_request:

jobs:
  build-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install tox
      # library-core is a separate private repo — now that library-ui is
      # public, GITHUB_TOKEN no longer gets implicit cross-repo read access
      # to it, so pip's git clone needs its own credential. This rewrite
      # keeps the token out of requirements-*.txt (those stay plain https
      # URLs, safe to commit) and scopes the credential to just this one
      # clone via a read-only fine-grained PAT stored as a repo secret.
      - run: git config --global url."https://x-access-token:${{ secrets.LIBRARY_CORE_TOKEN }}@github.com/qubitera-cambridge/library-core".insteadOf "https://github.com/qubitera-cambridge/library-core"
      # Full, uncached regeneration — a clean checkout has no prior demo_cache
      # to scope against. Add a <framework>-docs step for each SDK as
      # library-core adds one.
      - run: tox -e qiskit-docs
      - run: tox -e docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Only deploy from main, not from PRs — a PR's build is verified above but
  # shouldn't publish until it's merged.
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build-site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
